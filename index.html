<style>html{background:#0a0c0e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Подходы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: одна колонка карточек упражнений, сверху вкладки, снизу закреплённый таймер отдыха */
:root {
  --bg: #0a0c0e;
  --surface: #14181c;
  --surface-2: #1f252b;
  --fg: #eef0f2;
  --muted: #8f9aa5;
  --line: #2a3138;
  --accent: #ff6a3d;
  --accent-fg: #14100e;
  --danger: #ff6b61;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Inter", -apple-system, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 12px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.date { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; text-transform: capitalize; letter-spacing: .01em; }
.date small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); text-transform: none; letter-spacing: 0; margin-bottom: 4px; }
.link { color: var(--muted); font-size: 14px; font-weight: 500; padding: 8px 4px; }
.link.on { color: var(--accent); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.tabs button { padding: 10px; border-radius: 9px; font-weight: 600; font-size: 15px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }

.card { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.top > div:first-child { min-width: 0; }
h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.total { text-align: right; flex: none; }
.total b { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: .9; font-variant-numeric: tabular-nums; display: block; }
.total span { font-size: 12px; color: var(--muted); }

.sets { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; align-items: center; }
.sets .empty { color: var(--muted); font-size: 13px; }
.chip { font-family: var(--font-display); font-weight: 600; font-size: 20px; min-width: 44px; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.chip.del { background: var(--danger); color: var(--accent-fg); font-family: var(--font-body); font-size: 13px; font-weight: 600; }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dy { height: 64px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; }
.dy span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.dy b { font-family: var(--font-display); font-size: 24px; line-height: 1; font-weight: 700; }
.dy i { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.dy i.has { background: var(--accent); }
.dy.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dy.on span { color: var(--bg); opacity: .75; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; aspect-ratio: 1 / 1; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; text-align: center; min-width: 0; }
.tile svg, .tile .pic { width: 54px; height: 54px; flex: none; }
.pic { display: block; background: currentColor; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
.tile .nm { font-weight: 600; font-size: 14px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tile .sw { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; line-height: 1; color: transparent; }
.tile .cnt { position: absolute; top: 6px; right: 9px; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--accent); }
.tile.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tile.on .sw { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tile.add { border-style: dashed; color: var(--muted); background: transparent; }
.tile.add .plus { font-size: 40px; line-height: 46px; font-weight: 300; }
.icons { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.icons button { aspect-ratio: 1 / 1; border-radius: 10px; border: 1.5px solid var(--line); display: grid; place-items: center; }
.icons button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.icons svg { width: 26px; height: 26px; }
.icons .pic { width: 30px; height: 30px; }
.cardic { width: 28px; height: 28px; flex: none; }
.ttl { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.quick button { height: 80px; border-radius: 16px; border: 1.5px solid var(--line); font-family: var(--font-display); font-weight: 700; font-size: 36px; }
.quick button:active { background: var(--surface-2); }

.entry { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; gap: 10px; }
.entry .step { height: 76px; border-radius: 16px; background: var(--surface-2); font-size: 34px; font-weight: 500; }
.entry input { height: 76px; width: 100%; min-width: 0; text-align: center; border: 1.5px solid var(--line); border-radius: 16px; background: transparent; color: var(--fg);
  font-family: var(--font-display); font-weight: 700; font-size: 40px; font-variant-numeric: tabular-nums; }
.entry .add { grid-column: 1 / -1; height: 84px; border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 20px; }
.entry .add:active { filter: brightness(.9); }

.edit { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 8px; }
.edit input, .newform input { height: 44px; min-width: 0; width: 100%; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: var(--fg); font: inherit; }
.edit .icons, .newform .icons { grid-column: 1 / -1; }
.edit .rm { grid-column: 1 / -1; color: var(--danger); font-weight: 500; font-size: 14px; padding: 8px; text-align: left; }
.lbl { font-size: 12px; color: var(--muted); }

.newform { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 8px; }
.newform .go { grid-column: 1 / -1; height: 48px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 600; }
.addbtn { height: 52px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--muted); font-weight: 600; }

/* история */
.week { display: flex; gap: 20px; align-items: flex-end; padding: 4px 2px; }
.week b { font-family: var(--font-display); font-size: 40px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
.week span { font-size: 12px; color: var(--muted); }
.day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.day-h h2 { text-transform: capitalize; }
.day-h b { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.row .n { font-weight: 500; font-size: 15px; }
.row .s { color: var(--muted); font-size: 14px; grid-column: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.row .t { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-display); font-weight: 700; font-size: 24px; align-self: center; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 13px; text-align: center; padding: 8px 0; }

/* таймер */
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding-top: 10px;
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-top: 1px solid var(--line); }
.timer .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.timer .time { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .lab { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.timer select { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface-2); border: 0; border-radius: 8px; padding: 4px 6px; }
.timer .btns { display: flex; gap: 8px; }
.timer .btns button { height: 46px; padding: 0 16px; border-radius: 12px; background: var(--surface-2); font-weight: 600; }
.timer .btns .main { background: var(--fg); color: var(--bg); min-width: 84px; }
.bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.timer.done { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.timer.done .lab { color: var(--accent-fg); }
.timer.done .btns .main { background: var(--accent-fg); color: var(--accent); }
.timer.done .bar { background: rgba(255,255,255,.35); }
@media (prefers-reduced-motion: no-preference) { .timer.done .time { animation: pulse .8s ease-in-out 3; } }
@keyframes pulse { 50% { opacity: .35; } }
</style>

<div class="app">
  <header>
    <div class="date" id="dateH"></div>
    <button class="link" id="editBtn" type="button">Изменить</button>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" type="button" id="tabToday" aria-selected="true">Сегодня</button>
    <button role="tab" type="button" id="tabHist" aria-selected="false">История</button>
  </div>
  <div class="days" id="days"></div>
  <main id="view"></main>
</div>

<div class="timer" id="timer">
  <div class="in">
    <div>
      <div class="time" id="tmTime">1:00</div>

        <select id="restSel" aria-label="Время отдыха"></select>

    <div class="btns">
      <button type="button" id="tmPlus">+15</button>
      <button type="button" id="tmMain" class="main">Старт</button>
    </div>
    <div class="bar"><i id="tmFill"></i></div>
  </div>
</div>

    var k = curKey(), s = state.days[k];
    if (!s && k !== dkey()) { var dl = state.log[k] || {}; s = Object.keys(dl).filter(function (id) { return dl[id].length; }); }
    else if (!s) { s = (state.lastSel || []).slice(); if (!s.length && activeEx().length) s = [activeEx()[0].id]; }
    return s.filter(function (id) { var e = exById(id); return e && !e.off; });
  }
  function setSel(s) { state.days[curKey()] = s; if (!cur) state.lastSel = s; save(); }
  var cur = null;
  function curKey() { return cur || dkey(); }
  function renderDays() {
    var el = document.getElementById('days'); el.hidden = tab !== 'today'; if (tab !== 'today') return;
    var h = '', ck = curKey(), names = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i); var k = dkey(d), lg = state.log[k] || {};
      var has = Object.keys(lg).some(function (id) { return lg[id].length; });
      h += '<button type="button" class="dy' + (k === ck ? ' on' : '') + '" data-k="' + k + '" aria-label="' + k + '"><span>' + (i === 0 ? 'сег' : names[d.getDay()]) + '</span><b>' + d.getDate() + '</b><i' + (has ? ' class="has"' : '') + '></i></button>';
    }
    el.innerHTML = h;
  }
  document.getElementById('days').addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]'); if (!b) return;
    cur = b.dataset.k === dkey() ? null : b.dataset.k; pendingDel = null; adding = false; render();
  });

  function renderHeader() {
    var d = cur ? parseKey(cur) : new Date(); renderDays();
    document.getElementById('dateH').innerHTML = '<small>' + d.getFullYear() + '</small>' + esc(d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }));
    var b = document.getElementById('editBtn');
    b.hidden = tab !== 'today';
    b.textContent = editMode ? 'Готово' : 'Изменить';
    b.classList.toggle('on', editMode);
    document.getElementById('tabToday').setAttribute('aria-selected', tab === 'today');
    document.getElementById('tabHist').setAttribute('aria-selected', tab === 'history');
  }

  function formHtml() {
    return '<form class="card newform" id="newForm"><div><div class="lbl">Название</div><input id="nfName" maxlength="60" placeholder="Например, подтягивания"></div>' +
      '<div><div class="lbl">Вес, кг</div><input id="nfW" inputmode="decimal" placeholder="0"></div>' + iconPicker(formIcon) +
      '<button class="go" type="submit">Добавить упражнение</button></form>';
  }

  function renderToday() {
    var k = curKey(), day = state.log[k] || {}, html = '', sel = getSel(), act = activeEx();
    if (!editMode) {
      html += '<div><div class="lbl" style="margin-bottom:8px">Что делаю сегодня: нажмите, чтобы включить</div><div class="tiles">';
      act.forEach(function (e) {
        var c = sum(day[e.id] || []), on = sel.indexOf(e.id) >= 0;
        html += '<button type="button" class="tile' + (on ? ' on' : '') + '" data-act="tile" data-id="' + e.id + '" aria-pressed="' + on + '"><span class="sw">✓</span>' +
          (c ? '<span class="cnt">' + c + '</span>' : '') + ico(e.icon) + '<span class="nm">' + esc(e.name) + '</span></button>';
      });
      html += '<button type="button" class="tile add" data-act="new" aria-label="Новое упражнение"><span class="plus">+</span><span class="nm">Новое</span></button></div></div>';
      if (adding) html += formHtml();
    }
    act.forEach(function (ex) {
      if (!editMode && sel.indexOf(ex.id) < 0) return;
      var sets = day[ex.id] || [], tot = sum(sets);
      var sub = [wTxt(ex.w), sets.length ? sets.length + ' ' + plural(sets.length, 'подход', 'подхода', 'подходов') : ''].filter(Boolean).join(' · ');
      html += '<section class="card" data-ex="' + ex.id + '"><div class="top"><div class="ttl">' + (editMode ? '' : ico(ex.icon, 'cardic')) + '<div><h2>' + esc(ex.name) + '</h2>' +
        (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div></div><div class="total"><b>' + tot + '</b><span>повт.</span></div></div>';
      if (editMode) {
        html += '<div class="edit"><div><div class="lbl">Название</div><input data-f="name" value="' + esc(ex.name) + '" maxlength="60"></div>' +
          '<div><div class="lbl">Вес, кг</div><input data-f="w" inputmode="decimal" value="' + (ex.w || '') + '" placeholder="0"></div>' + iconPicker(ex.icon) +
          '<button type="button" class="rm" data-act="rm">Убрать упражнение</button></div>';
      } else {
        html += '<div class="sets">';
        if (!sets.length) html += '<span class="empty">Пока нет подходов</span>';
        sets.forEach(function (s, i) {
          var isDel = pendingDel === ex.id + ':' + i;
          html += '<button type="button" class="chip' + (isDel ? ' del' : '') + '" data-act="chip" data-i="' + i + '">' + (isDel ? 'Удалить' : s.r) + '</button>';
        });
        html += '</div><div class="quick">';
        [5, 10, 15, 20].forEach(function (n) { html += '<button type="button" data-act="quick" data-n="' + n + '">' + n + '</button>'; });
        html += '</div><div class="entry"><button type="button" class="step" data-act="minus" aria-label="Меньше">−</button>' +
          '<input inputmode="numeric" pattern="[0-9]*" data-f="reps" value="' + (ex.last || 10) + '" aria-label="Повторы">' +
          '<button type="button" class="step" data-act="plus" aria-label="Больше">+</button>' +
          '<button type="button" class="add" data-act="add">Записать подход</button></div>';
      }
      html += '</section>';
    });
    if (editMode) {
      html += adding ? formHtml() : '<button type="button" class="addbtn" data-act="new">＋ Новое упражнение</button>';
    } else if (!sel.length) html += '<div class="note">Включите хотя бы одно упражнение выше.</div>';
    else html += '<div class="note">Тап по подходу удаляет его</div>';
    view.innerHTML = html;
    if (adding) { var n = document.getElementById('nfName'); if (n) n.focus(); }
  }

  function renderHistory() {
    var keys = Object.keys(state.log).filter(function (k) {
      var d = state.log[k]; return Object.keys(d).some(function (id) { return d[id].length; });
    }).sort().reverse();
    if (!keys.length) { view.innerHTML = '<div class="note">История пуста. Запишите первый подход на вкладке «Сегодня».</div>'; return; }
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var wTot = 0, wDays = 0;
    keys.forEach(function (k) {
      var diff = Math.round((now - parseKey(k)) / 864e5);
      if (diff >= 0 && diff < 7) { wDays++; Object.keys(state.log[k]).forEach(function (id) { wTot += sum(state.log[k][id]); }); }
    });
    var html = '<div class="week"><div><b>' + wTot + '</b><span>повторов за 7 дней</span></div><div><b>' + wDays + '</b><span>' + plural(wDays, 'тренировка', 'тренировки', 'тренировок') + '</span></div></div>';
    keys.forEach(function (k) {
      var d = state.log[k], total = 0, rows = '';
      state.exercises.forEach(function (ex) {
        var sets = d[ex.id]; if (!sets || !sets.length) return;
        var t = sum(sets); total += t;
        rows += '<div class="row"><div class="n">' + esc(ex.name) + (ex.w ? ' · ' + wTxt(ex.w) : '') + '</div><div class="s">' +
          sets.map(function (s) { return s.r; }).join(' · ') + '</div><div class="t">' + t + '</div></div>';
      });
      html += '<section class="card"><div class="day-h"><h2>' +
        esc(parseKey(k).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })) + '</h2><b>' + total + '</b></div>' + rows + '</section>';
    });
    view.innerHTML = html;
  }

  function render() { renderHeader(); if (tab === 'today') renderToday(); else renderHistory(); }

  /* ---------- действия ---------- */
  function addSet(ex, n) {
    n = Math.round(n);
    if (!(n > 0) || n > 9999) return;
    var k = curKey(); state.log[k] = state.log[k] || {}; (state.log[k][ex.id] = state.log[k][ex.id] || []).push({ r: n, t: Date.now() });
    ex.last = n; pendingDel = null; save(); render(); if (!cur) startTimer();
  }
  view.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'tile') {
      var sel = getSel(), i = sel.indexOf(b.dataset.id);
      if (i >= 0) sel.splice(i, 1); else sel.push(b.dataset.id);
      pendingDel = null; setSel(sel); renderToday(); return;
    }
    if (act === 'new') { adding = true; renderToday(); return; }
    var card = b.closest('[data-ex]'), ex = card && exById(card.dataset.ex);
    if (act === 'icon') {
      Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
      if (ex) { ex.icon = b.dataset.ic; save(); } else formIcon = b.dataset.ic;
      return;
    }
    var inp = card && card.querySelector('[data-f="reps"]');
    if (act === 'quick') addSet(ex, +b.dataset.n);
    else if (act === 'add') addSet(ex, parseInt(inp.value, 10));
    else if (act === 'plus' || act === 'minus') {
      var v = (parseInt(inp.value, 10) || 0) + (act === 'plus' ? 1 : -1); inp.value = Math.max(1, v); ex.last = +inp.value; save();
    } else if (act === 'chip') {
      var key = ex.id + ':' + b.dataset.i;
      if (pendingDel === key) { state.log[curKey()][ex.id].splice(+b.dataset.i, 1); pendingDel = null; save(); }
      else pendingDel = key;
      renderToday();
    } else if (act === 'rm') { ex.off = true; save(); renderToday(); }
  });
  view.addEventListener('change', function (e) {
    var f = e.target.dataset.f, card = e.target.closest('[data-ex]'); if (!f || !card) return;
    var ex = exById(card.dataset.ex);
    if (f === 'name') { ex.name = e.target.value.trim() || ex.name; }
    else if (f === 'w') { ex.w = parseFloat(String(e.target.value).replace(',', '.')) || 0; }
    else if (f === 'reps') { ex.last = parseInt(e.target.value, 10) || ex.last; }
    save();
  });
  view.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('nfName').value.trim(); if (!name) return;
    var w = parseFloat(String(document.getElementById('nfW').value).replace(',', '.')) || 0;
    var id = 'e' + Date.now().toString(36);
    state.exercises.push({ id: id, name: name, w: w, last: 10, off: false, icon: formIcon });
    var sl = getSel(); sl.push(id); setSel(sl);
    adding = false; formIcon = 'dumbbell'; save(); renderToday();
  });
  document.getElementById('editBtn').addEventListener('click', function () { editMode = !editMode; adding = false; pendingDel = null; render(); });
  document.getElementById('tabToday').addEventListener('click', function () { tab = 'today'; render(); });
  document.getElementById('tabHist').addEventListener('click', function () { tab = 'history'; editMode = false; adding = false; render(); });

  /* ---------- таймер отдыха ---------- */
  var timerEl = document.getElementById('timer'), tmTime = document.getElementById('tmTime'), tmFill = document.getElementById('tmFill'),
      tmMain = document.getElementById('tmMain'), tmLab = document.getElementById('tmLab'), restSel = document.getElementById('restSel');
  var end = 0, total = 0, tickId = null, done = false, audio = null;
  [30, 45, 60, 90, 120, 180].forEach(function (s) {
    var o = document.createElement('option'); o.value = s; o.textContent = s < 60 ? s + ' с' : (s / 60) + ' мин'.replace('.', ',');
    if (s === 90) o.textContent = '1,5 мин'; if (s === 60) o.textContent = '1 мин';
    restSel.appendChild(o);
  });
  restSel.value = state.rest;
  if (restSel.value != state.rest) { state.rest = 60; restSel.value = 60; }
  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function beep() {
    try {
      if (!audio) return;
      for (var i = 0; i < 3; i++) {
        var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.28;
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.start(t); o.stop(t + 0.22);
      }
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
  }
  function paint() {
    var left = end - Date.now();
    if (end && !done && left <= 0) { done = true; beep(); }
    timerEl.classList.toggle('done', done);
    if (done) { tmTime.textContent = '0:00'; tmLab.textContent = 'Отдых закончен'; tmMain.textContent = 'Ок'; tmFill.style.width = '100%'; stopTick(); }
    else if (end) { tmTime.textContent = fmt(left); tmLab.textContent = 'Отдых'; tmMain.textContent = 'Стоп'; tmFill.style.width = Math.min(100, (1 - left / total) * 100) + '%'; }
    else { tmTime.textContent = fmt(state.rest * 1000); tmLab.textContent = 'Отдых'; tmMain.textContent = 'Старт'; tmFill.style.width = '0'; }
  }
  function stopTick() { if (tickId) { clearInterval(tickId); tickId = null; } }
  function startTimer() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.resume) audio.resume(); } catch (e) {}
    total = state.rest * 1000; end = Date.now() + total; done = false; stopTick(); tickId = setInterval(paint, 250); paint();
  }
  function resetTimer() { end = 0; done = false; stopTick(); paint(); }
  tmMain.addEventListener('click', function () { if (end && !done) resetTimer(); else if (done) resetTimer(); else startTimer(); });
  document.getElementById('tmPlus').addEventListener('click', function () {
    if (!end || done) { startTimer(); return; }
    end += 15000; total += 15000; paint();
  });
  restSel.addEventListener('change', function () { state.rest = +restSel.value; save(); if (!end) paint(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (end && !done) { if (!tickId) tickId = setInterval(paint, 250); } paint(); renderHeader(); } });

  render(); paint();
})();
</script>
